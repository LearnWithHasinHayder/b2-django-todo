{% extends 'authcheck/base.html' %}

{% block title %}Admin Panel{% endblock %}

{% block content %}
<div class="bg-white shadow rounded-lg overflow-hidden">
    <div class="bg-blue-600 px-4 py-5 border-b border-blue-500">
        <h2 class="text-xl font-semibold text-white">Admin Control Panel</h2>
    </div>
    <div class="p-6">
        <div class="bg-blue-50 border-l-4 border-blue-400 p-4 mb-6">
            <p class="text-blue-700">{{ message }}</p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <div class="p-6">
                    <h5 class="text-lg font-medium text-gray-900 mb-2">User Management</h5>
                    <p class="text-gray-600">Manage user accounts and permissions</p>
                </div>
            </div>
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <div class="p-6">
                    <h5 class="text-lg font-medium text-gray-900 mb-2">System Settings</h5>
                    <p class="text-gray-600">Configure system parameters</p>
                </div>
            </div>
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <div class="p-6">
                    <h5 class="text-lg font-medium text-gray-900 mb-2">Analytics</h5>
                    <p class="text-gray-600">View system statistics and reports</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
